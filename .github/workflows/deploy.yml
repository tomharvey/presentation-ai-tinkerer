# Build the deck and publish it to GitHub Pages.
#
# Pages must be switched on once by hand: Settings > Pages > Build and
# deployment > Source: "GitHub Actions". Until that's done this workflow builds
# fine and fails at the deploy step.
#
# On a free plan Pages only serves from a PUBLIC repo. This one is private, so
# making it public is the prerequisite — see the README before doing that, the
# deck carries real company figures.
name: Deploy deck to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
